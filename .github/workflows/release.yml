name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install pinned Bun
        run: npm install --global bun@1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:official-app
      - run: pnpm scan:network
      - run: pnpm verify:upstream
      - name: Download the pinned official OpenCode binary for E2E
        shell: bash
        run: |
          mkdir -p .build/opencode-bin
          url=$(node -p "require('./upstream.lock.json').binaries.linuxX64.url")
          expected=$(node -p "require('./upstream.lock.json').binaries.linuxX64.sha256")
          curl --fail --location --retry 3 --output .build/opencode-linux-x64.tar.gz "$url"
          echo "$expected  .build/opencode-linux-x64.tar.gz" | sha256sum --check --strict
          tar -xzf .build/opencode-linux-x64.tar.gz -C .build/opencode-bin
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the release E2E gate
        env:
          AIALRA_OPENCODE_E2E_BINARY: ${{ github.workspace }}/.build/opencode-bin/opencode
        run: pnpm test:e2e
      - name: Assemble immutable Node distributions
        shell: bash
        run: |
          mkdir -p artifacts/stage artifacts/release
          pnpm --filter @aialra-opencode/control-plane deploy --prod --legacy artifacts/stage/control-plane
          pnpm --filter @aialra-opencode/agent deploy --prod --legacy artifacts/stage/agent
          cp -R apps/web/dist artifacts/stage/web
          cp generated/route-capabilities.json upstream.lock.json LICENSE THIRD_PARTY_NOTICES.md artifacts/stage/
          tar -C artifacts/stage -czf artifacts/release/aialra-opencode-linux-x64.tar.gz .
          (cd artifacts/stage && zip -qr ../release/aialra-opencode-windows-x64.zip .)
          (cd artifacts/release && sha256sum aialra-opencode-* > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: artifacts/release/*
          if-no-files-found: error

  publish:
    needs: build-and-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "release/*"
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
